# =============================================================================
# PLAYERX SCALING TWEAKS
# =============================================================================
#
# Customize how player count affects monster HP, XP, physical damage,
# Attack Rating and NoDrop.
#
# Default setup:
#   - Monster scaling starts at p1.
#   - /players accepts values from p1 to p8.
#   - HP, XP, damage and Attack Rating use their normal scaling without caps.
#   - NoDrop uses the original game calculation.
#   - Battle.net simulation is disabled, so vanilla command behavior is retained.
#
# Configuration examples are provided at the bottom of this file.
# =============================================================================

# Configuration format version. Do not change.
config-version = 1

# Enable PlayerX Scaling Tweaks.
#
# true  = use the settings below.
# false = load the plugin without installing its gameplay hooks.
#
# The default settings below preserve vanilla gameplay even when this is true.
enabled = true


# =============================================================================
# BATTLE.NET SIMULATION
# =============================================================================

[battle-net-simulation]

# Select the master source for dynamic player scaling.
#
# false = preserve the normal /players command and Offline Difficulty behavior.
#        The optional NoDrop party simulation remains independently available.
# true  = use only the number of players actually connected to the game.
#         The /players command is unavailable, Offline Difficulty is locked to
#         p1 for this session (overwriting any earlier value), and the
#         NoDrop party simulation setting is ignored.
#
# The existing minimum-scaling-players and per-channel maximum-players values
# still apply when this mode is true. If this mode conflicts with another
# setting, this master mode wins; the configuration is not rejected.
#
# Battle.net-style example: true with minimum=1, all caps=0 and NoDrop
# simulation=false uses only connected players with uncapped vanilla scaling.
enabled = false


# =============================================================================
# PLAYER COUNT
# =============================================================================

[player-count]

# Minimum player count used for monster scaling.
#
# This is also the lowest value accepted by the /players command.
# It applies in multiplayer when fewer real players are connected.
#
# Examples:
#   1 = vanilla baseline.
#   4 = p1, p2, p3 and p4 all use p4 monster scaling.
#
# IMPORTANT:
# Every non-zero maximum-players value in the HP, XP and offense sections
# must be at least this baseline.
#
# With a p4 baseline:
#   0       = no cap for that scaling channel.
#   4       = that channel stays fixed at p4.
#   5+      = that channel scales above p4 and stops at the selected value.
#   1 to 3  = invalid configuration.
#
# Valid range: 1 to 65535.
minimum-scaling-players = 1

# Highest value accepted by the /players command.
#
# This does not limit the number of real connected multiplayer players.
#
#   8     = vanilla maximum.
#   64    = extended maximum suitable for heavily scaled mods.
#   65535 = technical plugin limit.
#
# Values above 8 are extended mod values and require runtime qualification.
maximum-command-players = 8


# =============================================================================
# MONSTER LIFE SCALING
# =============================================================================

[monster-life-scaling]

# true  = monster HP follows the effective player count.
# false = monster HP stays fixed at the minimum-scaling-players baseline.
enabled = true

# Stop increasing monster HP after this player count.
#
# This must be 0 or at least player-count.minimum-scaling-players.
# Example when the baseline is p4:
#   0       = no separate HP cap.
#   4       = monster HP stays fixed at p4.
#   16      = monster HP scales from p4 and stops increasing at p16.
#   1 to 3  = invalid configuration.
#
# This does not cap XP, offense or NoDrop.
maximum-players = 0


# =============================================================================
# MONSTER EXPERIENCE SCALING
# =============================================================================

[monster-experience-scaling]

# true  = monster XP follows the effective player count.
# false = monster XP stays fixed at the minimum-scaling-players baseline.
enabled = true

# Stop increasing monster XP after this player count.
#
# This must be 0 or at least player-count.minimum-scaling-players.
# Example when the baseline is p4:
#   0       = no separate XP cap.
#   4       = monster XP stays fixed at p4 scaling.
#   16      = monster XP scales from p4 and stops increasing at p16.
#   1 to 3  = invalid configuration.
#
# This does not cap HP, offense or NoDrop.
maximum-players = 0


# =============================================================================
# MONSTER OFFENSE SCALING
# =============================================================================

[monster-offense-scaling]

# D2R uses the same native player-count factor for monster physical damage
# and Attack Rating in Nightmare and Hell.
#
# true  = physical damage and Attack Rating follow the effective player count.
# false = both stay fixed at the minimum-scaling-players baseline.
#
# Normal difficulty keeps its native behavior.
enabled = true

# Stop increasing physical damage and Attack Rating after this player count.
#
# This must be 0 or at least player-count.minimum-scaling-players.
# Example when the baseline is p4:
#   0       = no separate offense cap.
#   4       = physical damage and Attack Rating stay fixed at p4 scaling.
#   16      = both scale from p4 and stop increasing at p16.
#   1 to 3  = invalid configuration.
#
# This does not cap HP, XP or NoDrop.
maximum-players = 0


# =============================================================================
# NODROP
# =============================================================================

[no-drop]

# NoDrop is the chance that a drop attempt produces no item.
# A higher effective player count generally means a lower NoDrop chance
# and therefore more successful item drops.
#
# Native D2R gives full NoDrop credit to nearby living party members.
# Other players represented by /players receive approximately half credit.
#
# Native solo examples:
#   /players 1 = 1 effective NoDrop player.
#   /players 4 = 2 effective NoDrop players.
#   /players 8 = 4 effective NoDrop players.
#
# Native party example:
#   4 nearby living party members = 4 effective NoDrop players.
#
# false = preserve the original NoDrop calculation.
#
# true = make the host's accepted /players X value simulate X nearby living
#        party members for NoDrop throughout the game.
#
# Simulation examples:
#   /players 4 = 4 effective NoDrop players.
#   /players 8 = 8 effective NoDrop players.
#
# A higher real nearby-party count is never reduced by the simulation.
# When [battle-net-simulation].enabled is true, this setting is inactive even
# when true because real connected players are the only dynamic source.
players-command-simulates-nearby-party = false


# =============================================================================
# TROUBLESHOOTING
# =============================================================================

[troubleshooting]

# Include adjustment counters in the PlayerX Scaling Tweaks status command.
#
# Leave this disabled during normal play.
# Enable it temporarily when testing or troubleshooting the plugin.
show-usage-counters = false


# =============================================================================
# D2RLOADER
# =============================================================================

[d2rl]

# Required for D2RLoader to associate this configuration with the plugin.
# Do not change.
match = true


# =============================================================================
# CONFIGURATION EXAMPLES
# =============================================================================
#
# These are examples only. Change the corresponding values above.
#
#
# EXAMPLE 1 — P4 BASELINE, P64 COMMAND LIMIT, HP CAPPED AT P16
#
#   [player-count]
#   minimum-scaling-players = 4
#   maximum-command-players = 64
#
#   [monster-life-scaling]
#   enabled = true
#   maximum-players = 16
#
# Result:
#   - p1 through p4 use p4 monster scaling.
#   - Scaling starts increasing again at p5.
#   - Monster HP stops increasing after p16.
#   - XP and monster offense continue beyond p16.
#
#
# EXAMPLE 2 — P4 BASELINE WITH FIXED MONSTER OFFENSE
#
#   [player-count]
#   minimum-scaling-players = 4
#
#   [monster-offense-scaling]
#   enabled = false
#
# Result:
#   - Monster HP and XP can continue scaling above p4.
#   - Physical damage and Attack Rating remain fixed at their p4 baseline.
#
#
# EXAMPLE 3 — PARTY-LIKE NODROP IN SOLO PLAY
#
#   [no-drop]
#   players-command-simulates-nearby-party = true
#
# Result:
#   - Solo /players 4 receives the NoDrop effect of 4 nearby party members.
#   - Solo /players 8 receives the NoDrop effect of 8 nearby party members.
#   - Monster scaling remains independently configurable.
#
#
# EXAMPLE 4 — HP CAPPED AT P16, EVERYTHING ELSE UNLIMITED
#
#   [monster-life-scaling]
#   maximum-players = 16
#
#   [monster-experience-scaling]
#   maximum-players = 0
#
#   [monster-offense-scaling]
#   maximum-players = 0
#
# Result:
#   - Monster HP stops increasing at p16.
#   - XP, physical damage and Attack Rating keep following player count.
#
#
# EXAMPLE 5 — BATTLE.NET-STYLE REAL PLAYERS, VANILLA MINIMUM AND NO CAPS
#
#   [battle-net-simulation]
#   enabled = true
#
#   [player-count]
#   minimum-scaling-players = 1
#   maximum-command-players = 8
#
#   [monster-life-scaling]
#   maximum-players = 0
#
#   [monster-experience-scaling]
#   maximum-players = 0
#
#   [monster-offense-scaling]
#   maximum-players = 0
#
#   [no-drop]
#   players-command-simulates-nearby-party = false
#
# Result:
#   - Connected players are the only dynamic scaling source.
#   - /players is unavailable and Offline Difficulty is forced to p1.
#   - Minimum p1 and unlimited channel caps preserve vanilla scaling curves.
#   - NoDrop uses real nearby party members, never command simulation.
